version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redteam
      POSTGRES_PASSWORD: redteam
      POSTGRES_DB: redteam
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports: ["5432:5432"]

  backend:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["5173:5173"]

volumes:
  pgdata:
